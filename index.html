<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Uygulaması</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      background: #4f46e5;
      color: #fff;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header p  { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }

    #logout-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
      margin-left: 12px;
      transition: background 0.2s;
    }
    #logout-btn:hover { background: rgba(255,255,255,0.35); }

    /* ── AUTH FORMS ── */
    .auth-panel {
      padding: 32px 28px;
    }

    .auth-panel h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .field input {
      width: 100%;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus { border-color: #4f46e5; }

    .otp-inputs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 4px 0 4px;
    }

    .otp-inputs input {
      width: 44px;
      height: 52px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .otp-inputs input:focus { border-color: #4f46e5; }

    .btn-primary {
      width: 100%;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }

    .btn-primary:hover { background: #4338ca; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }

    .auth-switch {
      text-align: center;
      margin-top: 16px;
      font-size: 0.85rem;
      color: #6b7280;
    }

    .auth-switch a {
      color: #4f46e5;
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
    }

    .auth-switch a:hover { text-decoration: underline; }

    .hint {
      font-size: 0.8rem;
      color: #6b7280;
      text-align: center;
      margin-bottom: 16px;
    }

    /* ── ERRORS / INFO ── */
    .banner {
      padding: 10px 20px;
      font-size: 0.85rem;
      display: none;
    }

    .banner.error { background: #fef2f2; color: #dc2626; border-bottom: 1px solid #fecaca; }
    .banner.info  { background: #eff6ff; color: #2563eb; border-bottom: 1px solid #bfdbfe; }

    /* ── TODO UI ── */
    .todo-wrapper { display: none; }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 18px 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .input-area input {
      flex: 1;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus { border-color: #4f46e5; }

    .input-area button {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-area button:hover   { background: #4338ca; }
    .input-area button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .filters {
      display: flex;
      gap: 4px;
      padding: 10px 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .filters button {
      flex: 1;
      padding: 6px;
      border: 1.5px solid #e5e7eb;
      border-radius: 6px;
      background: #fff;
      font-size: 0.8rem;
      cursor: pointer;
      color: #6b7280;
      transition: all 0.2s;
    }

    .filters button.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: #fff;
    }

    .todo-list { list-style: none; min-height: 60px; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 20px;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.15s;
    }

    .todo-item:hover { background: #fafafa; }

    .todo-item input[type="checkbox"] {
      width: 17px; height: 17px;
      accent-color: #4f46e5;
      cursor: pointer; flex-shrink: 0;
    }

    .todo-item span {
      flex: 1; font-size: 0.9rem;
      color: #111827; word-break: break-word;
    }

    .todo-item.done span { text-decoration: line-through; color: #9ca3af; }

    .todo-item .del {
      background: none; border: none;
      color: #d1d5db; font-size: 1rem;
      cursor: pointer; padding: 4px;
      border-radius: 4px; transition: color 0.2s; flex-shrink: 0;
    }

    .todo-item .del:hover { color: #ef4444; }
    .todo-item.busy { opacity: 0.45; pointer-events: none; }

    .empty {
      text-align: center; padding: 36px 20px;
      color: #9ca3af; font-size: 0.88rem;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 20px;
      font-size: 0.8rem;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
    }

    .footer button {
      background: none; border: none;
      color: #ef4444; font-size: 0.8rem;
      cursor: pointer;
    }

    .footer button:hover { text-decoration: underline; }

    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid #e5e7eb;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div>
      <h1>Todo Listesi</h1>
      <p id="header-sub">Giriş yapın veya kayıt olun</p>
    </div>
    <button id="logout-btn" style="display:none">Çıkış</button>
  </div>

  <div class="banner" id="banner"></div>

  <!-- LOGIN -->
  <div class="auth-panel" id="view-login">
    <h2>Giriş Yap</h2>
    <div class="field">
      <label>E-posta</label>
      <input type="email" id="login-email" placeholder="ornek@eposta.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="login-btn">Giriş Yap</button>
    <p class="auth-switch">Hesabın yok mu? <a id="go-register">Kayıt ol</a></p>
  </div>

  <!-- REGISTER -->
  <div class="auth-panel" id="view-register" style="display:none">
    <h2>Kayıt Ol</h2>
    <div class="field">
      <label>E-posta</label>
      <input type="email" id="reg-email" placeholder="ornek@eposta.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="reg-pass" placeholder="En az 6 karakter" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Şifre Tekrar</label>
      <input type="password" id="reg-pass2" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="register-btn">Kayıt Ol</button>
    <p class="auth-switch">Zaten hesabın var mı? <a id="go-login">Giriş yap</a></p>
  </div>

  <!-- OTP VERIFY -->
  <div class="auth-panel" id="view-otp" style="display:none">
    <h2>E-postanı Doğrula</h2>
    <p class="hint" id="otp-hint">E-posta adresine 6 haneli doğrulama kodu gönderdik.</p>
    <div class="field">
      <div class="otp-inputs" id="otp-inputs">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
      </div>
    </div>
    <button class="btn-primary" id="verify-btn">Doğrula</button>
    <p class="auth-switch"><a id="resend-otp">Kodu tekrar gönder</a></p>
  </div>

  <!-- TODO APP -->
  <div class="todo-wrapper" id="view-todo">
    <div class="input-area">
      <input type="text" id="todo-input" placeholder="Yeni görev ekle..." maxlength="200">
      <button id="add-btn">+</button>
    </div>
    <div class="filters">
      <button class="active" data-filter="all">Tümü</button>
      <button data-filter="active">Aktif</button>
      <button data-filter="done">Tamamlanan</button>
    </div>
    <ul class="todo-list" id="todo-list">
      <li class="empty"><span class="spinner"></span> Yükleniyor...</li>
    </ul>
    <div class="footer">
      <span id="remaining"></span>
      <button id="clear-done">Tamamlananları sil</button>
    </div>
  </div>

</div><!-- /container -->

<script>
  const SB_URL  = 'https://rrhxtgjjkrfbfmyklxcv.supabase.co';
  const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyaHh0Z2pqa3JmYmZteWtseGN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTAyNTEsImV4cCI6MjA5MzY2NjI1MX0.frTBhaT3LjTwjMpX3zHDr_vMP4OX0Sku7HsViSb-cfI';

  // ── helpers ────────────────────────────────────────────────────────────────
  let accessToken = null;

  function authHeaders(extra = {}) {
    return {
      'apikey': SB_ANON,
      'Authorization': `Bearer ${accessToken || SB_ANON}`,
      'Content-Type': 'application/json',
      ...extra
    };
  }

  async function sbFetch(method, path, body, isAuth = false) {
    const base = isAuth ? `${SB_URL}/auth/v1` : `${SB_URL}/rest/v1`;
    const extra = isAuth ? {} : { 'Prefer': 'return=representation' };
    const res = await fetch(`${base}${path}`, {
      method,
      headers: authHeaders(extra),
      body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 204) return null;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || data.message || `HTTP ${res.status}`);
    return data;
  }

  // ── views ──────────────────────────────────────────────────────────────────
  function show(id) {
    ['view-login','view-register','view-otp','view-todo'].forEach(v => {
      const el = document.getElementById(v);
      if (v === 'view-todo') {
        el.style.display = v === id ? 'block' : 'none';
      } else {
        el.style.display = v === id ? 'block' : 'none';
      }
    });
    document.getElementById('todo-wrapper') // handled via class
    document.getElementById('view-todo').style.display = id === 'view-todo' ? 'block' : 'none';
  }

  function banner(msg, type = 'error') {
    const el = document.getElementById('banner');
    el.textContent = msg;
    el.className = `banner ${type}`;
    el.style.display = 'block';
    if (type === 'info') setTimeout(() => { el.style.display = 'none'; }, 5000);
  }

  function clearBanner() {
    const el = document.getElementById('banner');
    el.style.display = 'none';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── OTP input UX ───────────────────────────────────────────────────────────
  document.getElementById('otp-inputs').addEventListener('input', e => {
    const inputs = [...document.querySelectorAll('.otp-inputs input')];
    if (!/^\d$/.test(e.target.value)) { e.target.value = ''; return; }
    const idx = inputs.indexOf(e.target);
    if (idx < 5) inputs[idx + 1].focus();
  });

  document.getElementById('otp-inputs').addEventListener('keydown', e => {
    const inputs = [...document.querySelectorAll('.otp-inputs input')];
    const idx = inputs.indexOf(e.target);
    if (e.key === 'Backspace' && !e.target.value && idx > 0) inputs[idx - 1].focus();
    if (e.key === 'ArrowLeft'  && idx > 0) inputs[idx - 1].focus();
    if (e.key === 'ArrowRight' && idx < 5) inputs[idx + 1].focus();
  });

  document.getElementById('otp-inputs').addEventListener('paste', e => {
    const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
    if (!text) return;
    e.preventDefault();
    const inputs = [...document.querySelectorAll('.otp-inputs input')];
    text.split('').forEach((ch, i) => { if (inputs[i]) inputs[i].value = ch; });
    inputs[Math.min(text.length, 5)].focus();
  });

  function getOtpValue() {
    return [...document.querySelectorAll('.otp-inputs input')].map(i => i.value).join('');
  }

  function clearOtp() {
    document.querySelectorAll('.otp-inputs input').forEach(i => i.value = '');
    document.querySelector('.otp-inputs input').focus();
  }

  // ── auth state ─────────────────────────────────────────────────────────────
  let pendingEmail = '';

  function onLogin(session) {
    accessToken = session.access_token;
    const email = session.user?.email || '';
    document.getElementById('header-sub').textContent = email;
    document.getElementById('logout-btn').style.display = 'block';
    clearBanner();
    show('view-todo');
    loadTodos();
  }

  function onLogout() {
    accessToken = null;
    todos = [];
    document.getElementById('header-sub').textContent = 'Giriş yapın veya kayıt olun';
    document.getElementById('logout-btn').style.display = 'none';
    show('view-login');
  }

  // ── NAV ────────────────────────────────────────────────────────────────────
  document.getElementById('go-register').addEventListener('click', () => { clearBanner(); show('view-register'); });
  document.getElementById('go-login').addEventListener('click',    () => { clearBanner(); show('view-login'); });

  // ── REGISTER ───────────────────────────────────────────────────────────────
  document.getElementById('register-btn').addEventListener('click', async () => {
    const email = document.getElementById('reg-email').value.trim();
    const pass  = document.getElementById('reg-pass').value;
    const pass2 = document.getElementById('reg-pass2').value;
    clearBanner();

    if (!email || !pass) return banner('E-posta ve şifre zorunludur.');
    if (pass.length < 6)  return banner('Şifre en az 6 karakter olmalıdır.');
    if (pass !== pass2)   return banner('Şifreler eşleşmiyor.');

    const btn = document.getElementById('register-btn');
    btn.disabled = true; btn.textContent = 'Kayıt yapılıyor…';
    try {
      await sbFetch('POST', '/signup', { email, password: pass }, true);
      pendingEmail = email;
      document.getElementById('otp-hint').textContent =
        `${email} adresine 6 haneli doğrulama kodu gönderdik.`;
      clearOtp();
      show('view-otp');
      banner('Doğrulama kodu e-postanıza gönderildi.', 'info');
    } catch(e) {
      banner(e.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Kayıt Ol';
    }
  });

  // ── OTP VERIFY ─────────────────────────────────────────────────────────────
  document.getElementById('verify-btn').addEventListener('click', async () => {
    const token = getOtpValue();
    if (token.length < 6) return banner('Lütfen 6 haneli kodu girin.');
    clearBanner();

    const btn = document.getElementById('verify-btn');
    btn.disabled = true; btn.textContent = 'Doğrulanıyor…';
    try {
      const data = await sbFetch('POST', '/verify',
        { type: 'signup', email: pendingEmail, token }, true);
      onLogin(data);
    } catch(e) {
      banner('Geçersiz veya süresi dolmuş kod. ' + e.message);
      clearOtp();
    } finally {
      btn.disabled = false; btn.textContent = 'Doğrula';
    }
  });

  // ── RESEND OTP ─────────────────────────────────────────────────────────────
  document.getElementById('resend-otp').addEventListener('click', async () => {
    clearBanner();
    try {
      await sbFetch('POST', '/resend',
        { type: 'signup', email: pendingEmail }, true);
      banner('Yeni kod gönderildi.', 'info');
      clearOtp();
    } catch(e) {
      banner('Kod gönderilemedi: ' + e.message);
    }
  });

  // ── LOGIN ──────────────────────────────────────────────────────────────────
  document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;
    clearBanner();
    if (!email || !pass) return banner('E-posta ve şifre zorunludur.');

    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Giriş yapılıyor…';
    try {
      const data = await sbFetch('POST', '/token?grant_type=password',
        { email, password: pass }, true);
      onLogin(data);
    } catch(e) {
      banner('Giriş başarısız: ' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Giriş Yap';
    }
  });

  // Enter tuşu desteği
  ['login-email','login-pass'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    })
  );
  ['reg-email','reg-pass','reg-pass2'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('register-btn').click();
    })
  );

  // ── LOGOUT ─────────────────────────────────────────────────────────────────
  document.getElementById('logout-btn').addEventListener('click', async () => {
    try { await sbFetch('POST', '/logout', {}, true); } catch(_) {}
    onLogout();
  });

  // ── TODOS ──────────────────────────────────────────────────────────────────
  let todos  = [];
  let filter = 'all';

  const listEl     = document.getElementById('todo-list');
  const remainEl   = document.getElementById('remaining');
  const todoInput  = document.getElementById('todo-input');
  const addBtn     = document.getElementById('add-btn');

  function render() {
    const visible = todos.filter(t =>
      filter === 'all' ? true : filter === 'done' ? t.done : !t.done
    );

    listEl.innerHTML = visible.length === 0
      ? '<li class="empty">Görev yok</li>'
      : visible.map(t => `
          <li class="todo-item ${t.done ? 'done' : ''}" data-id="${t.id}">
            <input type="checkbox" ${t.done ? 'checked' : ''}>
            <span>${escHtml(t.text)}</span>
            <button class="del" title="Sil">✕</button>
          </li>`).join('');

    remainEl.textContent = `${todos.filter(t => !t.done).length} görev kaldı`;
  }

  async function loadTodos() {
    listEl.innerHTML = '<li class="empty"><span class="spinner"></span> Yükleniyor…</li>';
    try {
      todos = await sbFetch('GET', '/todos?order=created_at.desc');
      render();
    } catch(e) {
      listEl.innerHTML = '<li class="empty">Yükleme hatası</li>';
      banner('Görevler yüklenemedi: ' + e.message);
    }
  }

  async function addTodo() {
    const text = todoInput.value.trim();
    if (!text) return;
    addBtn.disabled = true;
    try {
      const data = await sbFetch('POST', '/todos',
        { text, done: false, user_id: null });
      todos.unshift(Array.isArray(data) ? data[0] : data);
      todoInput.value = '';
      render();
    } catch(e) {
      banner('Görev eklenemedi: ' + e.message);
    } finally {
      addBtn.disabled = false;
      todoInput.focus();
    }
  }

  async function toggleTodo(id, done) {
    listEl.querySelector(`[data-id="${id}"]`)?.classList.add('busy');
    try {
      await sbFetch('PATCH', `/todos?id=eq.${id}`, { done });
      const t = todos.find(t => t.id === id);
      if (t) t.done = done;
      render();
    } catch(e) {
      banner('Güncelleme başarısız: ' + e.message);
      render();
    }
  }

  async function deleteTodo(id) {
    listEl.querySelector(`[data-id="${id}"]`)?.classList.add('busy');
    try {
      await sbFetch('DELETE', `/todos?id=eq.${id}`);
      todos = todos.filter(t => t.id !== id);
      render();
    } catch(e) {
      banner('Silme başarısız: ' + e.message);
      render();
    }
  }

  async function clearDone() {
    if (!todos.some(t => t.done)) return;
    try {
      await sbFetch('DELETE', '/todos?done=eq.true');
      todos = todos.filter(t => !t.done);
      render();
    } catch(e) {
      banner('Silme başarısız: ' + e.message);
    }
  }

  addBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

  listEl.addEventListener('change', e => {
    if (e.target.type === 'checkbox') {
      const id = +e.target.closest('.todo-item').dataset.id;
      toggleTodo(id, e.target.checked);
    }
  });

  listEl.addEventListener('click', e => {
    if (e.target.classList.contains('del')) {
      const id = +e.target.closest('.todo-item').dataset.id;
      deleteTodo(id);
    }
  });

  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  document.getElementById('clear-done').addEventListener('click', clearDone);

  // ── INIT ───────────────────────────────────────────────────────────────────
  show('view-login');
</script>
</body>
</html>
